switch:
  - platform: template
    name: "Timer active"
    icon: "mdi:timer-check"
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      float v = mower->get_register(0x4A4E);
      if (std::isnan(v)) return {};
      return (int)v == 1;
    on_turn_on:
      - logger.log: "Timer active => ON"
      - lambda: |-
          esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
          uint8_t data[5] = {0x0F, 0xCA, 0x4E, 0x00, 0x01};
          mower->queueFrame(data);
    turn_on_action:
      - logger.log: "Timer active => ON"
      - lambda: |-
          esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
          uint8_t data[5] = {0x0F, 0xCA, 0x4E, 0x00, 0x01};
          mower->queueFrame(data);
    on_turn_off:
      - logger.log: "Timer active => OFF"
      - lambda: |-
          esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
          uint8_t data[5] = {0x0F, 0xCA, 0x4E, 0x00, 0x00};
          mower->queueFrame(data);
    turn_off_action:
      - logger.log: "Timer active => OFF"
      - lambda: |-
          esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
          uint8_t data[5] = {0x0F, 0xCA, 0x4E, 0x00, 0x00};
          mower->queueFrame(data);
