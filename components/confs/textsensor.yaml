text_sensor:
  - platform: template
    id: "last_read_code"
    name: "Last received code"
    icon: "mdi:hexadecimal"
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      return {mower->get_last_code_received_text_sensor()->state};

  - platform: template
    id: "current_mode"
    name: "Current Mode"
    icon: "mdi:state-machine"
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      std::string s = mower->get_mode_text_sensor()->state;
      if (s.empty()) return {};
      return {s};

  - platform: template
    id: "status_sensor"
    name: "Status"
    icon: "mdi:robot-mower"
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      std::string s = mower->get_status_text_sensor()->state;
      if (s.empty()) return {};
      return {s};

  - platform: template
    id: "status_message_sensor"
    name: "Status Message"
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      std::string s = mower->get_status_message_text_sensor()->state;
      if (s.empty()) return {};
      return {s};

  - platform: template
    id: "charging_time_formatted"
    name: "Charging time"
    icon: "mdi:battery-clock"
    lambda: |-
      float total_min_f = id(chargingTimeSensor).state;
      if (std::isnan(total_min_f)) return {};
      int total_min = (int)total_min_f;
      int days = total_min / 1440;
      int hours = (total_min % 1440) / 60;
      int mins = total_min % 60;
      char buf[64];
      if (days > 0) {
        sprintf(buf, "%d d, %d h, %d min", days, hours, mins);
      } else if (hours > 0) {
        sprintf(buf, "%d h, %d min", hours, mins);
      } else {
        sprintf(buf, "%d min", mins);
      }
      return (std::string)buf;

  - platform: template
    id: "mowing_time_formatted"
    name: "Mowing time"
    icon: "mdi:av-timer"
    lambda: |-
      float total_min_f = id(mowingTimeSensor).state;
      if (std::isnan(total_min_f)) return {};
      int total_min = (int)total_min_f;
      int days = total_min / 1440;
      int hours = (total_min % 1440) / 60;
      int mins = total_min % 60;
      char buf[64];
      if (days > 0) {
        sprintf(buf, "%d d, %d h, %d min", days, hours, mins);
      } else if (hours > 0) {
        sprintf(buf, "%d h, %d min", hours, mins);
      } else {
        sprintf(buf, "%d min", mins);
      }
      return (std::string)buf;

  - platform: template
    id: "mower_clock"
    name: "Mower clock"
    icon: "mdi:clock"
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      float sec_f = mower->get_register(0x36B1);
      float min_f = mower->get_register(0x36B3);
      float hour_f = mower->get_register(0x36B5);
      if (std::isnan(sec_f) || std::isnan(min_f) || std::isnan(hour_f)) return {};
      int sec = (int)sec_f;
      int min = (int)min_f;
      int hour = (int)hour_f;
      char buf[32];
      snprintf(buf, sizeof(buf), "%02d:%02d:%02d", hour, min, sec);
      return (std::string)buf;
