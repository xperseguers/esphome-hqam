# Timer schedule time pickers.
# Each timer register is at 0x4A00 | reg. The write uses 0xCA00 | reg.
# Hours: 0-23, Minutes: 0-59.
#
# Timer 1: weekday start/stop
# Timer 2: weekend start/stop
#
# Usage example:
#   packages:
#     - url: https://github.com/orrpan/esphome-hqam
#       ref: main
#       files:
#         - components/confs/datetime.yaml

time:
  - platform: gps
    id: gps_time

text_sensor:
  - platform: template
    id: "timer1_start_time"
    name: "Timer 1 Start"
    icon: "mdi:timer-play"
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      float h_f = mower->get_register(0x4A38);
      float m_f = mower->get_register(0x4A39);
      if (std::isnan(h_f) || std::isnan(m_f)) return {};
      int h = (int)h_f;
      int m = (int)m_f;
      char buf[8];
      snprintf(buf, sizeof(buf), "%02d:%02d", h, m);
      return (std::string)buf;

  - platform: template
    id: "timer1_stop_time"
    name: "Timer 1 Stop"
    icon: "mdi:timer-stop"
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      float h_f = mower->get_register(0x4A3A);
      float m_f = mower->get_register(0x4A3B);
      if (std::isnan(h_f) || std::isnan(m_f)) return {};
      int h = (int)h_f;
      int m = (int)m_f;
      char buf[8];
      snprintf(buf, sizeof(buf), "%02d:%02d", h, m);
      return (std::string)buf;

  - platform: template
