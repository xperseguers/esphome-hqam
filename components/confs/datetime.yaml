# Timer schedule time pickers.
# Each timer register is at 0x4A00 | reg. The write uses 0xCA00 | reg.
# Hours: 0-23, Minutes: 0-59.
# The mower's single-wire bus occasionally interleaves unrelated traffic
# (see the comment in checkUartRead()), which can momentarily corrupt one
# of these registers. Out-of-range readings are rejected below so a bad
# poll just keeps the last known-good time instead of showing garbage.
#
# Timer 1: weekday start/stop
# Timer 2: weekend start/stop
#
# Usage example:
#   packages:
#     - url: https://github.com/orrpan/esphome-hqam
#       ref: main
#       files:
#         - components/confs/datetime.yaml

time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: ${timezone}

