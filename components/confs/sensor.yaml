sensor:
  - platform: template
    id: batteryLevelSensor
    name: "Battery level"
    icon: "mdi:battery"
    unit_of_measurement: mAh
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      float v = mower->get_register(0x01EF);
      if (std::isnan(v)) return {};
      return {v};

  - platform: template
    id: chargingTimeSensor
    name: "Charging time"
    icon: "mdi:battery-clock"
    unit_of_measurement: min
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      float v = mower->get_register(0x01EC);
      if (std::isnan(v)) return {};
      return {v};

  - platform: template
    id: mowingTimeSensor
    name: "Mowing time"
    icon: "mdi:av-timer"
    unit_of_measurement: min
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      float v = mower->get_register(0x0056);
      if (std::isnan(v)) return {};
      return {v};

  - platform: template
