select:
  - platform: template
    id: mode_select
    name: "Mode select"
    update_interval: 10s
    options:
      - "MAN"
      - "AUTO"
      - "HOME"
      - "DEMO"
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      auto s = mower->get_mode_text_sensor()->state;
      if (s == "MAN" || s == "AUTO" || s == "HOME" || s == "DEMO")
        return {s};
      return {};
    set_action:
      then:
        - lambda: |-
            esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
            mower->set_mode(x);
